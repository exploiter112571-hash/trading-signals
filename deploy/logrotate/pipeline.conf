# User-level log rotation for the trading-signals collectors.
# Run hourly from crontab; logrotate's state file decides when rotation is due,
# so a sleeping PC just rotates on the next waking hour.
# Template: deploy/install.sh fills in the @...@ placeholders.
@DATA_DIR@/alerts.log
@DATA_DIR@/alerts_stdout.log
@DATA_DIR@/polymarket_odds.log
@DATA_DIR@/macro_fetch.log
@PIPELINE_DIR@/poller.log
@PIPELINE_DIR@/scorer.log
{
    weekly
    maxsize 10M
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
