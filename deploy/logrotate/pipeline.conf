# User-level log rotation for the trading-signals collectors.
# Run hourly from crontab; logrotate's state file decides when rotation is due,
# so a sleeping PC just rotates on the next waking hour.
/home/roboslayer777/alerts.log
/home/roboslayer777/alerts_stdout.log
/home/roboslayer777/polymarket_odds.log
/home/roboslayer777/macro_fetch.log
/home/roboslayer777/pipeline/poller.log
/home/roboslayer777/pipeline/scorer.log
{
    weekly
    maxsize 10M
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
